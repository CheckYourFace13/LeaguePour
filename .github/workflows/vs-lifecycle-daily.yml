name: Daily VenueSprocket lifecycle nudges

# Follow-up reminders for venue owners on stale leads, pending proposals/contracts/deposits,
# BEO readiness, and completed-event rebooking opportunities. "New inquiry -> immediate
# notification" is NOT part of this - that already fires synchronously on submission
# (src/lib/actions/vs.ts) and isn't a scheduled job. Each nudge fires at most once per subject.
#
# Requires a CRON_SECRET repository secret matching the CRON_SECRET environment variable
# configured on the Hostinger deployment - same one .github/workflows/db-heartbeat.yml uses.
# Manual-only as of 2026-09: the in-process scheduler (src/lib/scheduler.ts) now fires this job
# automatically every day (proven live - see scheduler-status). This workflow's own daily
# schedule was removed because Hostinger's CDN blocks/times out connections specifically from
# GitHub Actions runner IPs (a real, already-diagnosed, unrelated infra quirk), which made it
# fail on a real cadence and generate noisy, non-actionable "Run failed" emails even when the
# job itself succeeded via the internal scheduler moments earlier. Kept as a manual fallback.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VS lifecycle nudges
        run: |
          resp=$(curl -sS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/vs-lifecycle")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
