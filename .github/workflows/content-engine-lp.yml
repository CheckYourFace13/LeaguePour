name: LeaguePour content engine

# Same as content-engine-vs.yml, for LeaguePour (2/week cap). See that workflow's comment for the
# manual-only rationale and required secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without persisting anything (safe mode)"
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LP content engine
        run: |
          url="https://leaguepour.com/api/cron/content-engine-lp"
          if [ "${{ inputs.dry_run }}" = "true" ]; then url="$url?dryRun=true"; fi
          resp=$(curl -sS --max-time 180 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$url")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
