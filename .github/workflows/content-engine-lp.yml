name: LeaguePour content engine

# Same as content-engine-vs.yml, for LeaguePour (2/week cap). See that workflow's comment for the
# manual-only rationale and required secrets.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LP content engine
        run: |
          resp=$(curl -sS --max-time 180 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/content-engine-lp")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
