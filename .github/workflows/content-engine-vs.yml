name: VenueSprocket content engine

# Runs one content-engine step for VenueSprocket - either publishes a queued article that already
# has a finished, human-written body and passes every deterministic check, or queues the next
# topic's metadata (brief/outline/related links) with no body (see src/lib/content-engine/**).
# Never generates article bodies itself - no external API dependency. At most one action per run;
# runContentEngine() itself enforces the weekly publish cap (3/week) and the kill switch
# (AppSetting "content-engine-enabled").
#
# Requires CRON_SECRET (same repo secret as the other cron workflows). No other secret needed.
#
# Manual-only, same reasoning as vs-lifecycle-daily.yml: the in-process scheduler
# (src/lib/scheduler.ts) fires this automatically 3x/week already; GitHub Actions runner IPs get
# challenged by Hostinger's CDN, so a real `schedule:` trigger here would be unreliable. Kept as
# a manual fallback/on-demand trigger only.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VS content engine
        run: |
          resp=$(curl -sS --max-time 180 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/content-engine-vs")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
