name: VS refund selftest (manual)

# TEMPORARY, certification-only. Seeds two disposable VS venues with fake-Stripe-field
# VsPayment rows (no real charge possible) to safely exercise the deposit-refund flow's
# authorization/venue-scoping/failure-path/logging - see
# src/app/api/cron/vs-refund-selftest. Remove this workflow + route once verified.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "seed or failures"
        required: true
        default: "seed"
        type: choice
        options:
          - seed
          - failures

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run VS refund selftest
        run: |
          resp=$(curl -sS --max-time 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/vs-refund-selftest?${{ inputs.mode }}=1")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
