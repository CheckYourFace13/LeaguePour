name: Venue competitions check (manual)

# Read-only: lists a venue's competitions by exact name (title/status/registration count only) -
# via src/app/api/cron/venue-competitions-check. Built for the Q's Wine Bar draft-gridlock P0.
on:
  workflow_dispatch:
    inputs:
      venue:
        description: "Exact venue name"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check venue competitions
        run: |
          resp=$(curl -sS -G --max-time 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" --data-urlencode "venue=${{ inputs.venue }}" "https://leaguepour.com/api/cron/venue-competitions-check")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
