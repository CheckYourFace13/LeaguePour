name: DB schema check (manual)

# Manual-only diagnostic: verifies the OutreachContact indexes and vsStatus column type against
# Postgres's own system catalogs, via src/app/api/cron/db-schema-check. Read-only.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DB schema state
        run: |
          resp=$(curl -sS --max-time 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/db-schema-check")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
