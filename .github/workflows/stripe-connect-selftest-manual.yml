name: Stripe Connect selftest (manual)

# Manual-only diagnostic: reproduces the real "Connect Stripe" server action's stripe.accounts
# .create + accountLinks.create calls against one clearly-labeled test venue, and returns the
# actual Stripe error text instead of Next's redacted production digest - see
# src/app/api/cron/stripe-connect-selftest.
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Run Stripe Connect selftest
        run: |
          resp=$(curl -sS --max-time 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://leaguepour.com/api/cron/stripe-connect-selftest")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
