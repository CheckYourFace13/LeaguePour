name: Daily outreach batch

# Single schedule at 15:00 UTC = 10am America/Chicago in summer (CDT) or
# 9am in winter (CST) - both land inside the route's 9-11am Chicago window,
# so one entry covers both DST regimes. (A previous version used two
# schedule entries to "guarantee" 9am exactly; under GitHub Actions' normal
# scheduling jitter both could land in the valid window on the same
# morning and race each other for the same DB connection, which is what
# caused a same-day failed run. One schedule removes that race entirely.)
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outreach send
        run: |
          resp=$(curl -sS --max-time 600 "https://leaguepour.com/api/cron/outreach-send")
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' || exit 1
